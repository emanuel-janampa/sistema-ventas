server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/customers_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true

jwt:
  secret: mysecretkeymysecretkeymysecretkey12345
  expiration: 3600000
