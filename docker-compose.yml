services:
  # =========================================
  # EUREKA SERVER
  # =========================================
  eureka-server:
    build: ./infrastructure/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - ventas-network

  # =========================================
  # CONFIG SERVER
  # =========================================
  config-server:
    build: ./infrastructure/config-server
    container_name: config-server
    ports:
      - "8888:8888"

    depends_on:
      eureka-server:
        condition: service_started

    networks:
      - ventas-network

  # =========================================
  # MYSQL DATABASE
  # =========================================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ventas-network
  # =========================================
  # PRODUCTS SERVICE
  # =========================================
  products-service:
    build: ./microservice/products-service
    ports:
      - "8081"
    deploy:
      replicas: 1

    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

    networks:
      - ventas-network

  # =========================================
  # ORDERS SERVICE
  # =========================================
  orders-service:
    build: ./microservice/orders-service
    ports:
      - "8082"
    deploy:
      replicas: 1

    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

    networks:
      - ventas-network

  # =========================================
  # INVENTORY SERVICE
  # =========================================
  inventory-service:
    build: ./microservice/inventory-service
    ports:
      - "8083"
    deploy:
      replicas: 1

    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

    networks:
      - ventas-network
  # =========================================
  # CUSTOMERS SERVICE
  # =========================================
  customers-service:
    build: ./microservice/customers-service
    ports:
      - "8084"
    deploy:
      replicas: 1

    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

    networks:
      - ventas-network

  # =========================================
  # API GATEWAY
  # =========================================
  api-gateway:
    build: ./infrastructure/api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"

    depends_on:
      - eureka-server
      - config-server
      - products-service
      - orders-service
      - inventory-service
      - customers-service

    networks:
      - ventas-network

# =========================================
# NETWORK
# =========================================
networks:
  ventas-network:
    driver: bridge

volumes:
  mysql_data:
